<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter v2</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 85vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 5px; text-align: center; }
        .hint { color: var(--tg-theme-hint-color, #8e8e93); font-size: 14px; text-align: center; margin-bottom: 25px; }
        
        #upload-zone {
            width: 100%; max-width: 360px; height: 180px;
            border: 2px dashed var(--tg-theme-button-color, #007aff);
            border-radius: 16px; background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 15px; box-sizing: border-box; transition: background-color 0.2s;
        }
        #upload-zone.hover { background-color: rgba(0, 122, 255, 0.1); }
        #status-text { font-size: 15px; font-weight: bold; margin: 10px 0 0 0; text-align: center; }
        #file-input { display: none; }

        .btn {
            display: none; width: 100%; max-width: 360px;
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 10px; padding: 14px;
            font-weight: bold; font-size: 15px; margin-top: 20px; cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h2>Конвертер музыки в URL</h2>
    <p class="hint">Нажмите на зону для выбора трека или перетащите его мышкой</p>

    <div id="upload-zone">
        <span style="font-size: 45px;">🎵</span>
        <p id="status-text">Выбрать аудиофайл</p>
        <input type="file" id="file-input" accept="audio/*">
    </div>

    <button class="btn" id="copy-button">📋 Скопировать прямую ссылку</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let finalUrl = "";
        const zone = document.getElementById('upload-zone');
        const input = document.getElementById('file-input');
        const text = document.getElementById('status-text');
        const btn = document.getElementById('copy-button');

        // Открытие проводника
        zone.onclick = (e) => {
            if (e.target !== input) {
                input.value = null;
                input.click();
            }
        };

        // Глушим стандартное поведение браузера для Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            document.body.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
            zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
        });

        zone.ondragover = () => zone.classList.add('hover');
        zone.ondragleave = () => zone.classList.remove('hover');
        
        zone.ondrop = (e) => {
            zone.classList.remove('hover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                upload(e.dataTransfer.files[0]); // Берём строго ПЕРВЫЙ файл объекта File
            }
        };

        input.onchange = () => {
            if (input.files && input.files.length > 0) {
                upload(input.files[0]); // Берём строго ПЕРВЫЙ файл объекта File
            }
        };

        async function upload(fileObject) {
            if (!fileObject) return;

            text.innerText = "⏳ Загрузка и конвертация...";
            zone.style.pointerEvents = "none";
            btn.style.display = "none";

            const formData = new FormData();
            formData.append('file', fileObject); // Передаем чистый файл

            try {
                // Прямой POST-запрос на file.io
                const response = await fetch('https://file.io', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success && result.link) {
                    finalUrl = result.link; // Ссылка на скачивание файла
                    text.innerText = "✅ Ссылка успешно создана!";
                    btn.style.display = "block"; // Показываем кнопку "Скопировать"
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
                } else {
                    throw new Error();
                }
            } catch (err) {
                console.error(err);
                text.innerText = "❌ Ошибка загрузки";
                tg.showAlert("Не удалось загрузить файл. Попробуйте еще раз или выберите другой трек.");
            } finally {
                zone.style.style.pointerEvents = "auto";
            }
        }

        btn.onclick = () => {
            if (!finalUrl) return;
            navigator.clipboard.writeText(finalUrl).then(() => {
                tg.showAlert("Прямая URL ссылка скопирована в буфер обмена!");
            }).catch(() => {
                tg.showAlert("Ваша ссылка: " + finalUrl);
            });
        };
    </script>
</body>
</html>
