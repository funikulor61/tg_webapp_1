<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Web App Converter</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 85vh; box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 5px; }
        .hint { color: var(--tg-theme-hint-color, #8e8e93); font-size: 14px; text-align: center; margin-bottom: 20px; }
        
        /* Делаем зону элементом label, чтобы клик по ней автоматически и без багов открывал скрытый инпут */
        .drop-zone-label {
            width: 90%; max-width: 400px; height: 180px;
            border: 2px dashed var(--tg-theme-button-color, #007aff);
            border-radius: 16px; background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 10px; box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .drop-zone-label.hover { background-color: rgba(0, 122, 255, 0.1); }
        .drop-zone-label p { font-size: 15px; font-weight: 600; margin: 8px 0 0 0; text-align: center; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <h2>Конвертер музыки в URL</h2>
    <p class="hint">Выберите файл или перетащите его в зону ниже</p>

    <!-- Используем тег label для безопасного открытия проводника -->
    <label for="file-input" id="drop-zone" class="drop-zone-label">
        <span style="font-size: 40px;">🎵</span>
        <p id="drop-text">Нажмите для выбора или перетащите аудио сюда</p>
        <input type="file" id="file-input" accept="audio/*">
    </label>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Полностью глушим стандартные браузерные переходы при перетаскивании файлов
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        // Эффект наведения мыши при drag-and-drop
        dropZone.addEventListener('dragover', () => dropZone.classList.add('hover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

        // Обработка бросания файла в зону
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('hover');
            const dt = e.dataTransfer;
            if (dt.files && dt.files.length > 0) {
                // ЖЕСТКИЙ ХАК: берем строго первый элемент [0] и его имя .name
                sendFileNameToBot(dt.files[0].name); 
            }
        });

        // Сброс значения перед открытием, чтобы событие change срабатывало даже при выборе одного файла подряд
        fileInput.addEventListener('click', () => {
            fileInput.value = null;
        });

        // Обработка выбора файла через стандартный проводник устройства
        fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files.length > 0) {
                // ЖЕСТКИЙ ХАК: берем строго первый элемент [0] и его имя .name
                sendFileNameToBot(fileInput.files[0].name); 
            }
        });

        // Отправка данных обратно в чат боту
        function sendFileNameToBot(fileName) {
            if (fileName && fileName.trim() !== "") {
                tg.sendData(fileName); // Метод Telegram для отправки строки боту
            }
        }
    </script>
</body>
</html>
