<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter Native</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f7; padding: 20px; text-align: center; }
        
        .btn-wrap {
            position: relative;
            display: inline-block;
            margin-top: 50px;
        }
        .upload-btn {
            background: #007aff; color: #fff; border: none;
            padding: 15px 30px; border-radius: 12px;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }
        /* Натягиваем реальный инпут поверх кнопки на 100% размера с нулевой прозрачностью */
        #file-input {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .copy-btn {
            display: none; background: #34c759; color: #fff;
            border: none; padding: 12px 25px; border-radius: 10px;
            font-weight: bold; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Конвертер музыки в URL</h2>
    <p>Нажмите на кнопку ниже, чтобы выбрать аудиофайл</p>

    <div class="btn-wrap">
        <button class="upload-btn">🎵 Выбрать аудиофайл</button>
        <!-- Инпут лежит прямо поверх кнопки и принимает нативный тап -->
        <input type="file" id="file-input" accept="audio/*">
    </div>

    <p id="status-text"></p>
    <button class="copy-btn" id="copy-button">📋 Скопировать прямую ссылку</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let finalUrl = "";
        const input = document.getElementById('file-input');
        const text = document.getElementById('status-text');
        const copyBtn = document.getElementById('copy-button');

        input.onchange = async () => {
            if (!input.files.length) return;
            const file = input.files;

            text.innerText = "⏳ Загрузка файла...";
            copyBtn.style.display = "none";

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('https://file.io', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success && result.link) {
                    finalUrl = result.link;
                    text.innerText = "✅ Ссылка успешно создана!";
                    copyBtn.style.display = "inline-block";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
                } else { throw new Error(); }
            } catch (err) {
                text.innerText = "❌ Ошибка загрузки";
                tg.showAlert("Не удалось загрузить. Попробуйте еще раз.");
            }
        };

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(finalUrl);
            tg.showAlert("Ссылка скопирована в буфер обмена!");
        };
    </script>
</body>
</html>
