<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Web App Converter</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80vh;
        }
        h2 { text-align: center; margin-bottom: 5px; }
        .hint { color: var(--tg-theme-hint-color, #8e8e93); font-size: 14px; text-align: center; margin-bottom: 20px; }
        
        #drop-zone {
            width: 90%; max-width: 400px; height: 180px;
            border: 2px dashed var(--tg-theme-button-color, #007aff);
            border-radius: 16px; background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 10px; box-sizing: border-box;
            transition: background-color 0.2s;
        }
        #drop-zone.hover { background-color: rgba(0, 122, 255, 0.1); }
        #drop-zone p { font-size: 15px; font-weight: 600; margin: 8px 0 0 0; text-align: center; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <h2>Конвертер музыки в URL</h2>
    <p class="hint">Выберите файл на устройстве или перетащите его в область ниже</p>

    <div id="drop-zone">
        <span style="font-size: 40px;">🎵</span>
        <p id="drop-text">Нажмите для выбора или перетащите аудио сюда</p>
        <input type="file" id="file-input" accept="audio/*">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const dropText = document.getElementById('drop-text');

        // Открытие проводника по клику
        dropZone.addEventListener('click', (e) => {
            if (e.target !== fileInput) {
                fileInput.value = null; 
                fileInput.click();
            }
        });

        // Глушим стандартные переходы браузера для Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('hover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

        // Обработка перетаскивания файла
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('hover');
            const dt = e.dataTransfer;
            if (dt.files && dt.files.length > 0) {
                // ИСПРАВЛЕНО: берем первый файл из массива по индексу [0]
                sendFileNameToBot(dt.files[0].name); 
            }
        });

        // Обработка выбора через проводник
        fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files.length > 0) {
                // ИСПРАВЛЕНО: берем первый файл из массива по индексу [0]
                sendFileNameToBot(fileInput.files[0].name); 
            }
        });

        // Отправка данных боту
        function sendFileNameToBot(fileName) {
            if (fileName && fileName.trim() !== "") {
                dropText.innerText = "⏳ Отправка: " + fileName;
                // Отправляем имя текстом и Telegram автоматически закрывает Mini App
                tg.sendData(fileName); 
            }
        }
    </script>
</body>
</html>
